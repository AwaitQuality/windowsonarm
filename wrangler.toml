#:schema node_modules/wrangler/config-schema.json
# Workers deployment via @opennextjs/cloudflare (replaces the former
# Cloudflare Pages + @cloudflare/next-on-pages setup).
name = "windowsonarm-cf"
main = ".open-next/worker.js"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Kept enabled so CI can verify a deployment directly, without the zone's Bot
# Fight Mode 403ing the runner. Middleware marks that hostname noindex so it
# cannot compete with the real domain in search results.
workers_dev = true

# Serves the apex and www. Routes rather than a Workers custom domain, so the
# cutover from Pages is reversible by deleting these two lines.
routes = [
  { pattern = "windowsonarm.org/*", zone_name = "windowsonarm.org" },
  { pattern = "www.windowsonarm.org/*", zone_name = "windowsonarm.org" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "windows-on-arm"
database_id = "eed82e07-d376-4f11-a167-dd4c15b4f3ee"

# Backs Next's data cache (`unstable_cache`). Without this binding OpenNext
# resolves the incremental cache to "dummy" and every cached function recomputes
# on every request. Deliberately a separate bucket from `windowsonarm`, which is
# public via cdn.windowsonarm.org — cache entries must not be publicly readable.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "windowsonarm-next-cache"
