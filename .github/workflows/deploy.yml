name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
    # Documentation-only changes do not need a deploy.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  # Lets you redeploy the current master without pushing an empty commit.
  workflow_dispatch:

# One deploy at a time. A second push while the first is mid-deploy would
# otherwise race two `wrangler deploy` calls against the same Worker.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Prisma 7 requires >= 20.19.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The client is generated into lib/generated/prisma, which is gitignored,
      # so nothing typechecks or builds until this runs.
      - run: pnpm prisma generate

      # Gates the deploy. The build would catch type errors too, but failing here
      # is faster and the lint result is otherwise never seen.
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY comes from .env.production, which is
      # committed precisely so CI bakes the live key into the client bundle.
      - run: pnpm cf:build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # cf:build already produced .open-next; do not let the action rebuild.
          command: deploy

      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          sleep 10
          for path in / /statistics /sitemap.xml /api/v1/info /api/v1/posts; do
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://windowsonarm.org${path}?ci=${GITHUB_SHA}${attempt}")
              echo "${path} attempt ${attempt}: ${code}"
              if [ "$code" != "200" ]; then
                echo "::error::${path} returned ${code} after deploy"
                exit 1
              fi
            done
          done
