name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
    # Documentation-only changes do not need a deploy.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
  # Lets you redeploy the current master without pushing an empty commit.
  workflow_dispatch:

# One deploy at a time. A second push while the first is mid-deploy would
# otherwise race two `wrangler deploy` calls against the same Worker.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Prisma 7 requires >= 20.19.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The client is generated into lib/generated/prisma, which is gitignored,
      # so nothing typechecks or builds until this runs.
      - run: pnpm prisma generate

      # Gates the deploy. The build would catch type errors too, but failing here
      # is faster and the lint result is otherwise never seen.
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY comes from .env.production, which is
      # committed precisely so CI bakes the live key into the client bundle.
      # Needs credentials: the OpenNext build populates the R2 incremental cache.
      - run: pnpm cf:build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # cf:build already produced .open-next; do not let the action rebuild.
          command: deploy

      # Verifies the Worker on its own hostname. The production domain runs Bot
      # Fight Mode, which 403s a CI runner regardless of headers, so the checks
      # are split: workers.dev must return 200, and the real domain must merely
      # not be returning 5xx. Each path is requested three times, because the
      # sitemap bug this pipeline was written after only appeared on the second
      # request, once the cache was warm.
      - name: Smoke test the deployed Worker
        env:
          WORKER_URL: https://windowsonarm-cf.opensourceexpress.workers.dev
        run: |
          set -euo pipefail
          sleep 10
          for path in / /statistics /sitemap.xml /api/v1/info /api/v1/posts; do
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${WORKER_URL}${path}?ci=${GITHUB_SHA}${attempt}")
              echo "worker ${path} attempt ${attempt}: ${code}"
              if [ "$code" != "200" ]; then
                echo "::error::${path} returned ${code} on the deployed Worker"
                exit 1
              fi
            done
          done

      - name: Check the production domain is not erroring
        run: |
          set -euo pipefail
          for path in / /api/v1/posts /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'User-Agent: Mozilla/5.0 (compatible; windowsonarm-ci)' \
              "https://windowsonarm.org${path}?ci=${GITHUB_SHA}")
            echo "production ${path}: ${code}"
            case "$code" in
              5*) echo "::error::production ${path} returned ${code}"; exit 1 ;;
              403) echo "  (403 = Bot Fight Mode blocking the runner, not an app failure)" ;;
            esac
          done
